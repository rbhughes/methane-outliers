# Weekly ETL + site deploy. Petrinex regenerates every public month in a
# batch Friday night -> Saturday morning (Mountain); Sunday 13:00 UTC
# runs after that with a day of slack. The raw archive (~420 MB) and
# built parquet ride the Actions cache between runs, so a normal week
# only fetches the new/changed monthly zips.
#
# Interim data path: site data files are bundled into the Pages deploy.
# Once R2 is enabled on the Cloudflare account, switch to uploading
# data/site/* to the bucket (see the commented step) and set
# PUBLIC_DATA_BASE for the site build.
name: pipeline

on:
  schedule:
    - cron: "0 13 * * 0"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", "src/**", ".github/workflows/pipeline.yml"]

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PETRINEX_RAW: ${{ github.workspace }}/petrinex-data/raw
      PETRINEX_OUT: ${{ github.workspace }}/petrinex-data
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Restore Petrinex data cache
        uses: actions/cache@v4
        with:
          path: petrinex-data
          key: petrinex-data-${{ github.run_id }}
          restore-keys: petrinex-data-

      - name: Install
        run: uv sync

      - name: Fetch Petrinex data (incremental)
        run: |
          uv run petrinex probe
          uv run petrinex fetch-vol
          uv run petrinex fetch-infra

      - name: Build facility_months + infra parquet (incremental)
        run: |
          uv run petrinex build-facilities
          uv run petrinex build-infra

      - name: Score facilities, emit site artifacts
        run: uv run methane build --data "$PETRINEX_OUT" --out data/site

      # - name: Publish data artifacts to R2   (enable once R2 is on)
      #   env:
      #     CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      #     CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      #   run: |
      #     for f in scores.parquet facilities.geojson summary.json; do
      #       npx wrangler r2 object put "methane-outliers/site-data/$f" \
      #         --file "data/site/$f" --remote
      #     done

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build site (data bundled, interim)
        working-directory: site
        run: |
          npm ci
          mkdir -p public/data
          cp ../data/site/facilities.geojson ../data/site/summary.json public/data/
          npm run build

      - name: Deploy to Cloudflare Pages
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name methane-outliers --branch main
